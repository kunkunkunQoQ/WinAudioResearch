name: Validate API database

on:
  # On main-branch pushes, validate only synchronization/validator changes.
  # API tables are often updated through multiple sequential commits (for example
  # by the GitHub connector), so validating every intermediate CSV commit creates
  # expected red runs before catalog.json is synchronized.
  push:
    paths:
      - "api/catalog.json"
      - "api/schema.json"
      - "api/core-audio-audit.json"
      - "scripts/validate_api_db.py"
      - "scripts/validate_core_audio_audit.py"
      - "tests/test_core_audio_audit.py"
      - ".github/workflows/validate-api-db.yml"

  # Pull requests still validate every API database change. A PR represents the
  # complete proposed snapshot and must never merge with stale catalog counts.
  pull_request:
    paths:
      - "api/**"
      - "scripts/validate_api_db.py"
      - "scripts/validate_core_audio_audit.py"
      - "tests/test_core_audio_audit.py"
      - ".github/workflows/validate-api-db.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-api-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate API database
        run: python scripts/validate_api_db.py

      - name: Test Core Audio audit checks
        run: python -m unittest discover -s tests -v

      - name: Verify Core Audio identifiers against pinned Microsoft headers
        run: python scripts/validate_core_audio_audit.py --fetch-headers
