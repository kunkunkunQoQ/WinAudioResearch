name: Validate API database

on:
  push:
    paths:
      - "api/**"
      - "scripts/validate_api_db.py"
      - ".github/workflows/validate-api-db.yml"
  pull_request:
    paths:
      - "api/**"
      - "scripts/validate_api_db.py"
      - ".github/workflows/validate-api-db.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate API database
        run: python scripts/validate_api_db.py
